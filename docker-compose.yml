name: craiwl

services:
  postgres:
    image: postgres:16-alpine
    container_name: craiwl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: craiwl
      POSTGRES_PASSWORD: craiwl
      POSTGRES_DB: craiwl
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U craiwl -d craiwl']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: craiwl-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: craiwl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: craiwl
      MINIO_ROOT_PASSWORD: craiwl-dev-password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: craiwl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 craiwl craiwl-dev-password &&
      mc mb --ignore-existing local/craiwl-snapshots &&
      mc mb --ignore-existing local/craiwl-outputs &&
      echo 'minio buckets ready';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
